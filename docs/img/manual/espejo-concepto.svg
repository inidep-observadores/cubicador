<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img" aria-label="Una cuña antes y después de espejarla en eslora" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Una cuña antes y después de espejarla en eslora</title>
  <rect width="860" height="260" rx="14" fill="#0f172a"/>
  <text x="430" y="32" font-size="16" fill="#cbd5e1" text-anchor="middle" font-weight="700">Espejo en X (Eslora): la pieza se invierte sin moverse de lugar</text>
  <line x1="60" y1="200" x2="380" y2="200" stroke="#334155" stroke-width="2"/>
  <polygon points="100.0,200.0 340.0,200.0 340.0,90.0" fill="#0ea5e9" fill-opacity="0.35" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>
  <line x1="220" y1="60" x2="220" y2="208" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="228" y="72" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="400">centro</text>
  <text x="220" y="236" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="400">Antes: el filo hacia popa</text>
  <defs><marker id="fe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/></marker></defs>
  <line x1="400" y1="140" x2="455" y2="140" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#fe)"/>
  <text x="428" y="125" font-size="12" fill="#fb7185" text-anchor="middle" font-weight="700">Espejo X</text>
  <line x1="480" y1="200" x2="800" y2="200" stroke="#334155" stroke-width="2"/>
  <polygon points="520.0,200.0 760.0,200.0 520.0,90.0" fill="#0ea5e9" fill-opacity="0.35" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>
  <line x1="640" y1="60" x2="640" y2="208" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="648" y="72" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="400">mismo centro</text>
  <text x="640" y="236" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="400">Después: el filo hacia proa</text>
  <text x="70" y="60" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="700">POPA ←</text>
  <text x="790" y="60" font-size="12" fill="#94a3b8" text-anchor="end" font-weight="700">→ PROA</text>
</svg>
